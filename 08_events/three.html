    // MORE EFFECTIVE WAY OF DOING THE ABOVE CODE :-
    // WHY ? -> Use the interval ID to ensure only one timer interval is active at a time,
    // preventing multiple intervals from being created by repeated Start clicks.
    let intervalId ;
    document.querySelector('#start').addEventListener('click', () => {
    document.querySelector('#timer').innerHTML = `   `;
    if(!intervalId){
        intervalId = setInterval( () => {
        let date = new Date().toLocaleTimeString();
        document.querySelector('#timer').innerHTML = `Current Timer - ${date}`;
        }, 1000);
    }
    });

    document.querySelector('#stop').addEventListener('click', () => {
    clearInterval(intervalId);
    intervalId = null;
    });

</script>
