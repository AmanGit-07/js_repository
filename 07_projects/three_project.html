<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Three</title>
</head>
<body>
    <div class="clock"></div>
    <script type="text/javascript">
        const clockdiv = document.querySelector('.clock');

        setInterval(()=>{
            let date = new Date();
            clockdiv.innerHTML = `Current Time is ${date.toLocaleTimeString()}`;
        }, 1000);
    </script>
</body>
</html>
